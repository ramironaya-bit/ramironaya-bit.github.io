<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAYA</title>
<meta name="description" content="NAYA — música, sociología, movimiento y producción cultural. Y amigable a todo tipo de expresión artística.">
<meta name="theme-color" content="#0b0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@0,9..144,450;1,9..144,450&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a0a; --text:#f2ede4; --text-muted:#a89d8e; --text-faint:#6f665c;
    --gold:#e8b04a; --terra:#e0653a; --sand:#cbb389;
    --font-display:"Fraunces",ui-serif,Georgia,serif;
    --font-poster:"Anton",ui-sans-serif,sans-serif;
    --font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }

  a.portada{
    position:relative; display:flex; align-items:center; min-height:100svh; overflow:hidden;
    color:inherit; text-decoration:none;
  }
  .portada-bg{ position:absolute; inset:0; z-index:0; }
  .portada-bg img{ width:100%; height:100%; object-fit:cover; object-position:50% 60%; }
  .portada-bg::after{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(11,10,10,.88) 0%, rgba(11,10,10,.55) 42%, rgba(11,10,10,.05) 70%),
      linear-gradient(180deg, rgba(11,10,10,.35) 0%, rgba(11,10,10,0) 30%, rgba(11,10,10,.6) 100%);
  }
  .portada-copy{ position:relative; z-index:1; width:100%; max-width:1180px; margin:0 auto; padding:5rem 1.5rem; }
  @media (min-width:900px){ .portada-copy{ padding:5rem 3rem; } }
  .inner{ max-width:34rem; }

  .kicker{ font-family:var(--font-mono); font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem; }
  .kicker::before{ content:""; width:2.5rem; height:1px; background:var(--gold); }

  .title{ font-family:var(--font-poster); font-weight:400; text-transform:uppercase; line-height:.8; letter-spacing:-.015em; margin:0; font-size:clamp(6rem,24vw,13rem); color:var(--gold); }
  .title .out{ color:transparent; -webkit-text-stroke:2px var(--text); }

  .role{ font-family:var(--font-display); font-style:italic; font-size:clamp(1.05rem,2.2vw,1.5rem); color:var(--terra); margin:1.1rem 0 0; }
  .sub{ font-family:var(--font-display); font-style:italic; font-size:clamp(.9rem,1.6vw,1.1rem); color:var(--text-muted); margin:.3rem 0 0; }

  .thesis{ margin:1.8rem 0 0; padding-left:1rem; border-left:2px solid var(--terra); font-size:clamp(.98rem,1.4vw,1.12rem); line-height:1.55; max-width:32ch; }

  .enter{ display:inline-flex; align-items:center; gap:.7rem; margin-top:2.2rem; font-family:var(--font-mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); border:1px solid #8a6c2f; padding:.7rem 1.1rem; transition:background .15s,color .15s; }
  a.portada:hover .enter, a.portada:focus-visible .enter{ background:var(--gold); color:#1a1408; }
  @media (prefers-reduced-motion:no-preference){ .enter span{ display:inline-block; transition:transform .2s; } a.portada:hover .enter span{ transform:translateX(4px); } }

  @media (max-width:640px){
    .portada-bg::after{ background:linear-gradient(180deg, rgba(11,10,10,.55) 0%, rgba(11,10,10,.72) 100%); }
  }
</style>
</head>
<body>
  <a class="portada" href="creoquenaya/" aria-label="Entrar al sitio de NAYA">
    <div class="portada-bg"><img src="assets/portada.jpg" alt=""></div>
    <div class="portada-copy">
      <div class="inner">
        <div class="kicker">2026</div>
        <h1 class="title">NA<span class="out">YA</span></h1>
        <p class="role">música · sociología · movimiento · producción cultural</p>
        <p class="sub">y amigable a todo tipo de expresión artística</p>
        <p class="thesis">Músico, productor cultural, DJ, investigador, docente y donde nos lleve todo eso…</p>
        <span class="enter">Entrar <span>→</span></span>
      </div>
    </div>
  </a>
</body>
</html>
