<style>
  :root{
    --bg:#0b0a0a; --text:#f2ede4; --text-muted:#a89d8e; --text-faint:#6f665c;
    --gold:#e8b04a; --gold-soft:#8a6c2f; --terra:#c14a63; --sand:#cbb389;

    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",monospace;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; }

  .portada{ position:relative; display:flex; align-items:center; min-height:100svh; overflow:hidden; }
  .portada-bg{ position:absolute; inset:0; z-index:0; }
  .portada-bg img{ width:100%; height:100%; object-fit:cover; object-position:50% 60%; }
  .portada-bg::after{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(11,10,10,.88) 0%, rgba(11,10,10,.55) 42%, rgba(11,10,10,.05) 70%),
      linear-gradient(180deg, rgba(11,10,10,.35) 0%, rgba(11,10,10,0) 30%, rgba(11,10,10,.6) 100%);
  }
  .portada-copy{ position:relative; z-index:1; width:100%; max-width:1180px; margin:0 auto; padding:4rem 1.5rem; }
  @media (min-width:900px){ .portada-copy{ padding:4rem 3rem; } }
  .inner{ max-width:44rem; }

  .kicker{ font-family:var(--font-mono); font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); display:flex; align-items:center; gap:.8rem; margin-bottom:1.1rem; }
  .kicker::before{ content:""; width:2.5rem; height:1px; background:var(--gold); }

  .title{ font-family:var(--font-poster); font-weight:400; text-transform:uppercase; line-height:.8; letter-spacing:-.015em; margin:0; }
  .title .l1{ display:block; font-size:clamp(2.2rem,7vw,4.4rem); color:var(--text); opacity:.92; margin-bottom:.12em; }
  .title .l2{ display:block; font-size:clamp(6rem,24vw,13rem); color:var(--gold); }
  .title .out{ color:transparent; -webkit-text-stroke:1.5px var(--gold); }

  .role{ font-family:var(--font-display); font-style:italic; font-size:clamp(1.05rem,2.2vw,1.5rem); color:var(--text-muted); margin:1.1rem 0 0; }
    .thesis{ margin:1.6rem 0 0; padding-left:1rem; border-left:2px solid var(--gold); font-size:clamp(.98rem,1.4vw,1.12rem); line-height:1.55; max-width:47ch; }
  .thesis .mas{ font-family:var(--font-display); font-style:italic; color:var(--text-muted); }

  .doors{ display:grid; grid-template-columns:1fr; gap:.8rem; margin-top:2.2rem; }
  @media (min-width:640px){ .doors{ grid-template-columns:1fr 1fr; gap:1rem; } }
  .door{ display:flex; flex-direction:column; gap:.35rem; padding:1.1rem 1.2rem 1.15rem; border:1px solid var(--gold-soft); background:rgba(11,10,10,.55); backdrop-filter:blur(4px); color:inherit; text-decoration:none; transition:background .15s,border-color .15s; }
  .door .k{ font-family:var(--font-mono); font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--text-faint); }
  .door .t{ font-family:var(--font-poster); text-transform:uppercase; font-size:clamp(1.5rem,3.4vw,2rem); line-height:1; color:var(--gold); }
  .door .d{ font-size:.82rem; color:var(--text-muted); }
  .door .go{ margin-top:.5rem; font-family:var(--font-mono); font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); }
  .door:hover, .door:focus-visible{ background:var(--gold); border-color:var(--gold); }
  .door:hover .k, .door:focus-visible .k{ color:#4a3a14; }
  .door:hover .t, .door:focus-visible .t{ color:#1a1408; }
  .door:hover .d, .door:focus-visible .d{ color:#3a2d10; }
  .door:hover .go, .door:focus-visible .go{ color:#1a1408; }

  .door.acad{ background:#F4EFE6; border-color:#F4EFE6; backdrop-filter:none; }
  .door.acad .k{ color:#7A7368; }
  .door.acad .t{ color:#1F3A5F; }
  .door.acad .d{ color:#5F584F; }
  .door.acad .go{ color:#1F3A5F; }
  .door.acad:hover, .door.acad:focus-visible{ background:#1F3A5F; border-color:#8FA3BF; }
  .door.acad:hover .k, .door.acad:focus-visible .k{ color:#B9C6D8; }
  .door.acad:hover .t, .door.acad:focus-visible .t{ color:#F4EFE6; }
  .door.acad:hover .d, .door.acad:focus-visible .d{ color:#D6DEE9; }
  .door.acad:hover .go, .door.acad:focus-visible .go{ color:#F4EFE6; }

  @media (max-width:640px){
